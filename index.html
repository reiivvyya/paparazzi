<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101019;
  color: white;
  font-family: Georgia, serif;
  min-height: 100vh;
}

button {
  cursor: pointer;
  font-family: inherit;
}

#game {
  max-width: 850px;
  min-height: 100vh;
  margin: auto;
  background: #191925;
  position: relative;
  overflow: hidden;
}

.screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.hidden {
  display: none !important;
}

/* COVER */

.cover {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
  background:
    linear-gradient(#15152299,#151522ee),
    radial-gradient(circle at 50% 30%,#bd789b,#25243d 65%);
}

.cover h1 {
  font-size: 48px;
  letter-spacing: 5px;
  margin-bottom: 5px;
}

.cover p {
  color: #d6b9d0;
  letter-spacing: 3px;
  font-size: 12px;
}

.start {
  margin-top: 40px;
  background: #d99aba;
  color: #211625;
  border: none;
  padding: 15px 45px;
  border-radius: 30px;
  font-size: 15px;
}

/* SCENE */

.topbar {
  display: flex;
  justify-content: space-between;
  padding: 18px;
  font-family: Arial;
  font-size: 12px;
  color: #d4a9c4;
  border-bottom: 1px solid #ffffff15;
}

.scene {
  height: 42vh;
  min-height: 250px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(160deg,#746080,#d19aaf,#34314c);
  transition: background 1s;
}

.scene::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent,#171722aa);
}

.scene-title {
  position: absolute;
  top: 20px;
  left: 20px;
  font-family: Arial;
  font-size: 11px;
  letter-spacing: 3px;
  color: #fff;
}

.character {
  position: relative;
  z-index: 2;
  text-align: center;
  animation: appear .5s;
}

.avatar {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: auto;
  font-size: 60px;
  background: linear-gradient(135deg,#f6d6e6,#ad83b6);
  border: 4px solid #ffffff99;
  box-shadow: 0 0 40px #e8b7d877;
}

.character-name {
  margin-top: 12px;
  font-family: Arial;
  letter-spacing: 3px;
  font-size: 14px;
}

@keyframes appear {
  from {opacity:0; transform:translateY(15px);}
  to {opacity:1; transform:translateY(0);}
}

/* DIALOG */

.dialog-area {
  flex: 1;
  padding: 25px 20px;
  display: flex;
  flex-direction: column;
}

.chapter {
  color: #d99aba;
  font-family: Arial;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.dialog-box {
  background: #252432;
  border: 1px solid #ffffff15;
  border-radius: 15px;
  padding: 22px;
  min-height: 160px;
  line-height: 1.8;
  font-size: 16px;
  color: #eee5ee;
}

.dialog-name {
  color: #e3a6ca;
  font-family: Arial;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

#dialogText {
  white-space: pre-line;
}

.controls {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.next {
  border: none;
  background: #d99aba;
  color: #211625;
  border-radius: 12px;
  padding: 15px;
  font-size: 15px;
}

.choice {
  background: #302b3d;
  color: white;
  border: 1px solid #bd8bab66;
  padding: 14px;
  border-radius: 10px;
  text-align: left;
}

.choice:hover {
  background: #59425d;
}

.footer {
  padding: 15px;
  color: #82778c;
  text-align: center;
  font-family: Arial;
  font-size: 10px;
}

.music {
  background: #282432;
  border: 1px solid #d99aba55;
  color: #e7b4d0;
  border-radius: 20px;
  padding: 9px 15px;
  font-size: 12px;
}

#progress {
  height: 3px;
  background: #d99aba;
  width: 0%;
  transition: width .3s;
}

.ending {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
  background: radial-gradient(circle,#7c526e,#191925 70%);

.ending h1 {
  font-size: 38px;
  color: #f2c0d9;
}

.ending button {
  background: #d99aba;
  border: none;
  border-radius: 20px;
  padding: 14px 35px;
  margin-top: 20px;
}
</style>

/* GAME ENGINE */

let current = 0;
let history = [];

function startGame() {
  document.getElementById("cover").classList.add("hidden");
  document.getElementById("screen").classList.remove("hidden");

  current = 0;
  history = [];

  showDialogue();
}

function showDialogue() {

  let data = story[current];

  document.getElementById("chapter").textContent =
    data.chapter || "A DAY TO REMEMBER";

  document.getElementById("chapterTop").textContent =
    "CHAPTER 01";

  document.getElementById("sceneTitle").textContent =
    data.location || "SOMEWHERE";

  document.getElementById("scene").style.background =
    data.bg || "linear-gradient(150deg,#746080,#d19aaf,#34314c)";

  document.getElementById("avatar").textContent =
    data.avatar || "🌸";

  document.getElementById("characterName").textContent =
    data.name || "NARRATOR";

  document.getElementById("speaker").textContent =
    data.speaker || "NARRATOR";

  document.getElementById("dialogText").textContent =
    data.text;

  document.getElementById("progress").style.width =
    ((current + 1) / story.length * 100) + "%";

  let controls = document.getElementById("controls");
  controls.innerHTML = "";

  if (data.choices) {

    data.choices.forEach(choice => {

      let button = document.createElement("button");
      button.className = "choice";
      button.textContent = choice.text;

      button.onclick = () => {
        history.push(current);
        current = choice.next;
        showDialogue();
      };

      controls.appendChild(button);

    });

  } else {

    let button = document.createElement("button");
    button.className = "next";

    button.textContent =
      data.ending ? "FINISH STORY" : "NEXT →";

    button.onclick = nextDialogue;

    controls.appendChild(button);
  }

  if (data.ending) {
    controls.firstChild.textContent = "SEE ENDING";
  }

}

function nextDialogue() {

  if (story[current].ending) {
    finishGame();
    return;
  }

  history.push(current);
  current++;

  if (current >= story.length) {
    finishGame();
    return;
  }

  showDialogue();
}

function finishGame() {

  document.getElementById("screen").classList.add("hidden");
  document.getElementById("ending").classList.remove("hidden");

  document.getElementById("endingTitle").textContent =
    "A DAY TO REMEMBER";

  document.getElementById("endingText").textContent =
    "Every ordinary day can become an unforgettable memory. Thank you for being part of this story.";
}

function restartGame() {

  document.getElementById("ending").classList.add("hidden");
  document.getElementById("cover").classList.remove("hidden");

  current = 0;
  history = [];
}

/* MUSIC */

let playing = false;

function toggleMusic() {

  let music = document.getElementById("bgMusic");
  let button = document.getElementById("musicButton");

  if (!playing) {

    music.play().then(() => {
      playing = true;
      button.textContent = "♫ PAUSE MUSIC";
    }).catch(() => {
      button.textContent = "MUSIC FILE NOT FOUND";
    });

  } else {

    music.pause();
    playing = false;
    button.textContent = "♫ PLAY MUSIC";

  }
}

/* KEYBOARD SUPPORT */

document.addEventListener("keydown", function(event) {

  if (event.code === "Space" || event.code === "ArrowRight") {

    if (!document.getElementById("screen").classList.contains("hidden")) {

      if (!story[current].choices) {
        event.preventDefault();
        nextDialogue();
      }

    }

  }

});
